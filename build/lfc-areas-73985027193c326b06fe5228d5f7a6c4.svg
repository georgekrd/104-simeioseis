  <rect x="688" y="168" width="190" height="50" rx="4" fill="#ffffff" stroke="#1f2a33" stroke-width="1.4"/>
  <text x="783" y="199" font-family="Libertinus Serif, Times New Roman, serif" font-size="14" text-anchor="middle" fill="#1f2a33"><tspan font-size="14" dy="0">ACE</tspan><tspan font-size="10" dy="4">B</tspan><tspan font-size="14" dy="-4"> ≠ 0</tspan></text>
