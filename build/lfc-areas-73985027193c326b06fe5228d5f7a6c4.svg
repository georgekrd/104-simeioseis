  <rect x="96" y="258" width="238" height="44" rx="4" fill="#ffffff" stroke="#1f2a33" stroke-width="1.4"/>
  <text x="215" y="285" font-family="Libertinus Serif, Times New Roman, serif" font-size="14" text-anchor="middle" fill="#1f2a33"><tspan font-size="14" dy="0">ACE = K · Δf</tspan></text>
  <text x="215" y="320" font-family="Libertinus Serif, Times New Roman, serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#5b6b78" font-style="italic">μοναδικό κριτήριο: η συχνότητα</text>
  <line x1="430" y1="25" x2="430" y2="305" stroke="#5b6b78" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="670" y="34" font-family="Libertinus Serif, Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2a33">Διασυνδεδεμένο σύστημα</text>
  <rect x="480" y="60" width="165" height="52" rx="4" fill="#eef2f6" stroke="#1f2a33" stroke-width="1.4"/>
