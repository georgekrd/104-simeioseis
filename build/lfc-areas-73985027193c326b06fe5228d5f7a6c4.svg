  <rect x="468" y="244" width="410" height="44" rx="4" fill="#f4f6f2" stroke="#1f2a33" stroke-width="1.4"/>
  <text x="673" y="271" font-family="Libertinus Serif, Times New Roman, serif" font-size="14" text-anchor="middle" fill="#1f2a33"><tspan font-size="14" dy="0">ACE = ΔP</tspan><tspan font-size="10" dy="4">tie</tspan><tspan font-size="14" dy="-4"> + K · Δf</tspan></text>
  <text x="673" y="312" font-family="Libertinus Serif, Times New Roman, serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#5b6b78" font-style="italic">οι δύο όροι αλληλοαναιρούνται στην περιοχή χωρίς διαταραχή</text>
